<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MTS - Metric Trust Score</title>
    <!-- GitHub Pages is a static file server with no server-side rewrites,
         so a deep link or refresh on a route like /mts/help 404s here. This
         re-encodes the path into a query string and redirects to the app's
         index.html, which decodes it back (see the script in index.html).
         pathSegmentsToKeep must match how many segments of the base path
         to preserve - 1 while served at /mts/, change to 0 if this ever
         moves to serving from a domain root (e.g. mts.chaitrishodaya.com). -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
